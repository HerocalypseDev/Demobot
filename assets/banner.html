<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Rendered to PNG by scripts/banners.js. Query: ?t=title&s=subtitle&i=icon, or ?mode=avatar -->
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 400px; overflow: hidden; background: #f6f1e7; }
  .banner { position: relative; width: 1200px; height: 400px; }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(139, 94, 60, .16) 1.2px, transparent 1.6px);
    background-size: 22px 22px;
    -webkit-mask-image: linear-gradient(90deg, transparent 35%, #000 80%);
  }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: #8b5e3c; }
  .frame { position: absolute; inset: 22px 22px 22px 32px; border: 1px solid rgba(139, 94, 60, .22); }
  .text { position: absolute; left: 100px; top: 50%; transform: translateY(-50%); }
  .label { font: 600 15px 'Segoe UI', Arial, sans-serif; letter-spacing: .38em; color: #8b5e3c; }
  .title { font: 400 86px Georgia, 'Times New Roman', serif; color: #2b2118; margin-top: 14px; line-height: 1; }
  .rule { width: 72px; height: 3px; background: #8b5e3c; margin: 26px 0 22px; }
  .subtitle { font: 400 26px 'Segoe UI', Arial, sans-serif; color: #6b5847; }
  .disc { position: absolute; right: 90px; top: 50%; width: 300px; height: 300px; margin-top: -150px; border-radius: 50%; background: #ede3d1; }
  .icon { position: absolute; right: 150px; top: 50%; width: 180px; height: 180px; margin-top: -90px; }
  .icon svg { width: 100%; height: 100%; fill: none; stroke: #8b5e3c; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }

  body.avatar, body.avatar .banner { width: 512px; height: 512px; }
  .avatar .banner { background: #8b5e3c; }
  .ring { position: absolute; inset: 34px; border-radius: 50%; border: 3px solid rgba(246, 241, 231, .5); }
  .mono { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 400 300px Georgia, serif; color: #f6f1e7; padding-bottom: 20px; }
</style>
</head>
<body>
<div class="banner" id="root"></div>
<script>
  const icons = {
    help: '<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
    verify: '<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>',
    support: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
    roles: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
    welcome: '<path d="M5 21V4h10v17"/><path d="M15 6l4 1.2V21h-4"/><circle cx="12" cy="13" r=".6"/><path d="M3 21h18"/>',
    giveaway: '<rect x="3" y="9" width="18" height="4"/><path d="M5 13v8h14v-8M12 9v12"/><path d="M12 9C10 5 6 5 6 7.5S9 9 12 9s6-.5 6-1.5S14 5 12 9z"/>',
    applications: '<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 10h7M8.5 14h7M8.5 18h4"/>',
  };
  const q = new URLSearchParams(location.search);
  const root = document.getElementById('root');
  const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  if (q.get('mode') === 'avatar') {
    document.body.className = 'avatar';
    root.innerHTML = '<div class="ring"></div><div class="mono">D</div>';
  } else {
    root.innerHTML = `<div class="dots"></div><div class="bar"></div><div class="frame"></div>
      <div class="disc"></div><div class="icon"><svg viewBox="0 0 24 24">${icons[q.get('i')] ?? ''}</svg></div>
      <div class="text"><div class="label">DEMOBOT</div><div class="title">${esc(q.get('t') ?? '')}</div>
      <div class="rule"></div><div class="subtitle">${esc(q.get('s') ?? '')}</div></div>`;
  }
</script>
</body>
</html>
